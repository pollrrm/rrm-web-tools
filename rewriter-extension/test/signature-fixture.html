<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rewriter — signature trimming self-test</title>
<style>
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background:#0f1117; color:#e6e8ee;
         max-width: 940px; margin: 0 auto; padding: 30px 20px 60px; line-height: 1.5; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  p.sub { color:#8b91a3; font-size:13px; margin:0 0 20px; }
  .case { border:1px solid #262b38; border-radius:8px; padding:9px 13px; margin-bottom:7px; font-size:13px;
          background:#171a23; display:flex; gap:10px; align-items:baseline; }
  .case .r { font-weight:700; min-width:48px; }
  .pass .r { color:#3ecf8e; } .fail .r { color:#ff6b6b; }
  .case .d { color:#c3c8d4; }
  .case .got { color:#8b91a3; font-size:12px; display:block; margin-top:3px; white-space:pre-wrap;
               font-family: ui-monospace, Consolas, monospace; }
  #summary { font-size:15px; font-weight:600; margin:18px 0; }
</style>
</head>
<body>

<h1>Signature trimming self-test</h1>
<p class="sub">Exercises <code>text-utils.js</code>. Two halves: signatures it must remove, and content it
must leave alone. The second half matters more — eating a real draft is far worse than missing a signature.</p>

<div id="summary">Running…</div>
<div id="results"></div>

<script src="../text-utils.js"></script>
<script>
(function () {
  'use strict';

  var results = [], pass = 0, fail = 0;

  function check(desc, cond, got) {
    results.push({ desc: desc, ok: !!cond, got: got });
    if (cond) pass++; else fail++;
  }

  function strips(desc, input, mustKeep, mustDrop) {
    var out = TextUtils.stripSignature(input);
    var ok = out.trimmed &&
             out.text.indexOf(mustKeep) !== -1 &&
             out.text.indexOf(mustDrop) === -1;
    check(desc, ok, out.text);
  }

  function keeps(desc, input) {
    var out = TextUtils.stripSignature(input);
    check(desc, !out.trimmed && out.text === input.trim(), out.text);
  }

  /* ------------------------------------------------- must be trimmed */

  // The exact shape from the reported case.
  strips('Trims a "Best," block with name, title, email, phone and website',
    'Thanks, Katherine. Noted on the reassignment.\n\n' +
    'Christian, once the recommendations are ready, send them over to Rean and me and Web Support ' +
    'will get them queued for implementation.\n\n' +
    'Best,\n\n' +
    'Poll David\nWeb Support Manager\npoll@ringringmarketing.com\n888 – 383 – 2848\nRingRingMarketing.com',
    'queued for implementation', 'Poll David');

  strips('Trims a "Kind regards" block',
    'The banner is live on the homepage now.\n\nKind regards\n\nJane Smith\nAccount Manager\njane@example.com',
    'banner is live', 'Jane Smith');

  strips('Trims after the conventional "--" separator',
    'Here is the copy you asked for, ready to paste into the page template.\n\n--\nPoll David\nRing Ring Marketing',
    'ready to paste', 'Ring Ring Marketing');

  strips('Trims a contact block with no sign-off word at all',
    'Popup installed on the homepage, showing once per day per visitor as requested.\n\n' +
    'Poll David\nWeb Support Manager\npoll@ringringmarketing.com',
    'once per day', 'poll@ringringmarketing.com');

  strips('Trims a bare "Thanks!" closing at the end',
    'Could you send over the updated logo files when you get a chance? ' +
    'We need them before the page can go live on Thursday.\n\nThanks!',
    'updated logo files', 'Thanks!');

  strips('Trims an en-dash phone number in the signature',
    'All three pages are published and the redirects are in place, so you should be good to go.\n\n' +
    'Best regards,\nPoll\n888 – 383 – 2848',
    'redirects are in place', '888');

  /* -------------------------------------------- must be left alone */

  keeps('Leaves a message with no signature untouched',
    'Can you swap the homepage banner to the July artwork before Thursday? ' +
    'The current one still shows the June event and a few people have noticed.');

  keeps('Leaves an email address that is part of the actual content',
    'Please add poll@ringringmarketing.com to the contact page footer, and make sure the ' +
    'phone number next to it links properly on mobile devices as well.');

  keeps('Leaves a "thanks" that is mid-sentence rather than a closing',
    'Thanks to the new caching plugin the homepage now loads in well under two seconds, ' +
    'which is a big improvement on where it was last month.');

  keeps('Leaves a long block after "Best," that is clearly continued prose',
    'Best, in this case, means the version with the shorter headline.\n' +
    'We tested both against the same audience over two weeks.\n' +
    'The shorter one won on click-through by a wide margin.\n' +
    'It also read better on mobile, where most of the traffic is.\n' +
    'So I would go with that one for the launch.\n' +
    'Let me know if you want the raw numbers.\n' +
    'I can put them in a sheet for you.');

  keeps('Leaves a bulleted list of contact details that IS the content',
    'Here are the details that need to go on the new location page:\n' +
    '- Phone: 888 – 383 – 2848\n' +
    '- Email: info@example.com\n' +
    '- Website: www.example.com\n' +
    'All three should appear in the footer of every service page on the site.');

  /* ------------------------------------------------------- guards */

  var justSig = TextUtils.stripSignature('Best,\n\nPoll David\npoll@ringringmarketing.com');
  check('A selection that is ONLY a signature is left alone rather than emptied',
    !justSig.trimmed && justSig.text.length > 0, justSig);

  var shortOne = TextUtils.stripSignature('Done.\n\nBest,\nPoll\npoll@ringringmarketing.com');
  check('Trimming is refused when it would eat most of a very short message',
    !shortOne.trimmed, shortOne);

  var empty = TextUtils.stripSignature('');
  check('Empty input is handled', empty.text === '' && !empty.trimmed, empty);

  var nullish = TextUtils.stripSignature(null);
  check('Null input is handled', nullish.text === '' && !nullish.trimmed, nullish);

  /* -------------------------------------------------------- render */

  var el = document.getElementById('results');
  results.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'case ' + (r.ok ? 'pass' : 'fail');
    var rr = document.createElement('span'); rr.className = 'r'; rr.textContent = r.ok ? 'PASS' : 'FAIL';
    var dd = document.createElement('span'); dd.className = 'd'; dd.textContent = r.desc;
    if (!r.ok) {
      var g = document.createElement('span'); g.className = 'got';
      g.textContent = 'got: ' + JSON.stringify(r.got);
      dd.appendChild(g);
    }
    d.appendChild(rr); d.appendChild(dd);
    el.appendChild(d);
  });
  var s = document.getElementById('summary');
  s.textContent = fail === 0 ? ('All ' + pass + ' checks passed.') : (fail + ' failed, ' + pass + ' passed.');
  s.style.color = fail === 0 ? '#3ecf8e' : '#ff6b6b';
})();
</script>

</body>
</html>
